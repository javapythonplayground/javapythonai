# ============================================================
#  CodeMind LLM — Application Configuration
# ============================================================

server.port=8080
spring.application.name=codemind-llm

# ---- Anthropic Claude API ----
# Set your API key here OR via environment variable ANTHROPIC_API_KEY
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.url=https://api.anthropic.com
anthropic.api.version=2023-06-01
anthropic.model=claude-sonnet-4-20250514
anthropic.max.tokens=2048

# ---- Logging ----
logging.level.com.codemind=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---- Static resources ----
spring.web.resources.static-locations=classpath:/static/

# ---- Jackson ----
spring.jackson.serialization.indent-output=true
